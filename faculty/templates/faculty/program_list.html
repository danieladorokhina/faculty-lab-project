{% extends 'faculty/base.html' %} {% block content %}
    <h1>Наші освітні програми</h1>

    {% for p in programs %}
        <div class="card">
            <h2><a href="{% url 'program-detail' p.id %}">{{ p.name }}</a></h2>
            <p>{{ p.description|truncatewords:50 }}</p>
        </div>
    {% endfor %}
{% endblock %}
