{% extends 'faculty/base.html' %}

{% block content %}
    <h1>{{ department.name }}</h1>
    <p><strong>Завідувач:</strong> {{ department.head }}</p>
    <hr>
    <h2>Викладачі кафедри</h2>
    <ul>
        {% for teacher in department.teachers.all %}
            <li><strong>{{ teacher.name }}</strong> - {{ teacher.position }}</li>
        {% endfor %}
    </ul>
{% endblock %}
